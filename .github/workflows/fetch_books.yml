name: Fetch Goodreads Bookshelf

on:
  schedule:
    - cron: '0 6 * * *'  # Automatically runs daily at 06:00 UTC
  workflow_dispatch:      # Allows manual triggers anytime

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        run: python scripts/fetch_goodreads.py

      - name: Commit updated bookshelf
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update goodreads bookshelf data"
          file_pattern: "_data/books.json"
