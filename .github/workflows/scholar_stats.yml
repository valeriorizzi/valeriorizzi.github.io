name: Update Google Scholar Stats

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Google Scholar Card
        uses: techinpark/google-scholar-stats@v1
        with:
          scholar_id: HUdZjX4AAAAJ # Replace with your 12-character Scholar Profile ID
          output_path: assets/img/scholar_stats.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/scholar_stats.svg
          git diff-index --quiet HEAD || git commit -m "Updated Google Scholar stats"
          git push
