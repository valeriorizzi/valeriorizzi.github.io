name: Update Google Scholar Stats

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install google-search-results matplotlib

      - name: Fetch Stats via SerpApi and Generate SVG
        env:
          SCHOLAR_ID: "HUdZjX4AAAAJ"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python - << 'EOF'
          import os
          import matplotlib.pyplot as plt
          from serpapi import GoogleSearch

          params = {
              "engine": "google_scholar_author",
              "author_id": os.environ['SCHOLAR_ID'],
              "api_key": os.environ['SERPAPI_KEY']
          }

          search = GoogleSearch(params)
          results = search.get_dict()

          table = results.get("table", {})
          citations_info = table.get("citations", [])

          citations = citations_info[0].get("all", 0) if len(citations_info) > 0 else 0
          hindex = citations_info[1].get("all", 0) if len(citations_info) > 1 else 0
          i10index = citations_info[2].get("all", 0) if len(citations_info) > 2 else 0

          graph = results.get("graph", [])
          years = [int(item["year"]) for item in graph if int(item["year"]) >= 2018]
          counts = [int(item["citations"]) for item in graph if int(item["year"]) >= 2018]

          fig, ax = plt.subplots(figsize=(6, 2.8), dpi=150)
          fig.patch.set_facecolor('#0d1117')
          ax.set_facecolor('#0d1117')

          ax.bar(years, counts, color='#58a6ff', width=0.55)
          ax.tick_params(colors='#c9d1d9', labelsize=8)
          ax.spines['top'].set_visible(False)
          ax.spines['right'].set_visible(False)
          ax.spines['bottom'].set_color('#30363d')
          ax.spines['left'].set_color('#30363d')

          ax.set_title(f"Citations: {citations}  |  h-index: {hindex}  |  i10-index: {i10index}", 
                       color='#f0f6fc', fontsize=10, fontweight='bold', pad=12)

          os.makedirs('assets/img', exist_ok=True)
          plt.savefig('assets/img/scholar_stats.svg', bbox_inches='tight', transparent=False)
          print("Successfully generated assets/img/scholar_stats.svg")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/scholar_stats.svg
          git diff-index --quiet HEAD || git commit -m "Update Google Scholar stats SVG"
          git push
